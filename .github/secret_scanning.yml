# Secret scanning configuration
#
# `.env.example` files are documentation templates: their values are
# placeholder patterns (e.g. `XXXXXXXXX`), never real credentials. They are
# excluded from scanning so that template pushes are not blocked by
# false-positive matches. Real environment files (`.env`) are gitignored and
# never reach this repository.
paths-ignore:
  - "**/.env.example"
